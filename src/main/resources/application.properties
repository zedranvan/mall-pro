  server.port=8080


  logging.pattern.console=%clr(%d{HH:mm:ss}){faint} %clr(%-5level) %clr([%15.15t]){magenta} %clr(%-30.30logger{29}){cyan} : %msg%n
  logging.file.name=logs/mall-pro.log
    spring.output.ansi.enabled=ALWAYS


    spring.jackson.serialization.indent-output=true


    spring.datasource.driver-class-name=org.postgresql.Driver
    spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/mall_db}
    spring.datasource.username=${DB_USERNAME:mall}
    spring.datasource.password=${DB_PASSWORD:mall_password}


    spring.data.redis.host=${REDIS_HOST:127.0.0.1}
    spring.data.redis.port=${REDIS_PORT:6379}
    spring.data.redis.password=${REDIS_PASSWORD:redis_password}
    spring.data.redis.lettuce.pool.max-active=100
    spring.data.redis.lettuce.pool.max-idle=50
    spring.data.redis.lettuce.pool.min-idle=10


    spring.kafka.bootstrap-servers=${KAFKA_SERVERS:127.0.0.1:9092}

    # ?????
    spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
    spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
    # acks=1 ???? Leader ???????????????????
    spring.kafka.producer.acks=1

    # ?????
    spring.kafka.consumer.group-id=mall-order-paid-group
    spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
    spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
    # ???????????????????
    spring.kafka.consumer.auto-offset-reset=latest

    mybatis-plus.configuration.map-underscore-to-camel-case=true
    mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl