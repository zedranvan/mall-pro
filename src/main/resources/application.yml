server:
  port: 8080

spring:
  application:
    name: mall-pro

  jackson:
    serialization:
      indent-output: true

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/mall_db}
    username: ${DB_USERNAME:mall}
    password: ${DB_PASSWORD:mall_password}

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_password}
      lettuce:
        pool:
          max-active: 100
          max-idle: 50
          min-idle: 10


mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
